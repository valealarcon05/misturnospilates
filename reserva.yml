name: Bot Level Gym Reserva

on:
  schedule:
    # Se ejecuta a las 03:00 UTC (00:00 hs de Argentina) 
    # los días: Lunes (1), Miércoles (3) y Sábado (6)
    - cron: '0 3 * * 1,3,6'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar bot de reserva
        env:
          LEVEL_USER: ${{ secrets.LEVEL_USER }}
          LEVEL_PASS: ${{ secrets.LEVEL_PASS }}
        run: python bot.py
